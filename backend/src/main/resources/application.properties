spring.application.name=metromind-backend
# Listen on the platform-provided PORT when set (Render), else local 8080.
server.port=${PORT:8080}
# Cross-origin origins allowed to call /api/** (comma-separated).
# Defaults to the Vite dev server origin for local development.
# In production, set the app.cors.allowed-origins environment variable to your deployed frontend URL.
app.cors.allowed-origins=http://localhost:5173
